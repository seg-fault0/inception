services:
  nginx:
    container_name: nginx
    build: requirements/nginx/
    ports: 
      - 443:443
    depends_on:
      - wordpress
    volumes:
      - /home/wimam/data/wordpress:/var/www/html
    networks:
      - inception_network
    restart: on-failure

  wordpress:
    container_name: wordpress
    build: requirements/wordpress/
    depends_on:
      - mariadb
    volumes:
      - /home/wimam/data/wordpress:/var/www/html
    env_file:
      - .env
    networks:
      - inception_network
    restart: on-failure

  mariadb:
    container_name: mariadb
    build: requirements/mariadb/
    volumes:
      - /home/wimam/data/mysql:/var/lib/mysql
    env_file: 
      - .env
    networks:
      - inception_network
    restart: on-failure

networks:
  inception_network:
    driver: bridge
