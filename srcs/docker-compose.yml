services:
  nginx:
    container_name: nginx
    image: nginx
    build: requirements/nginx/
    ports: 
      - "${NGINX_PORT}:${NGINX_PORT}"
    depends_on:
      - wordpress
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception_network
    restart: on-failure
    env_file:
      - .env

  wordpress:
    container_name: wordpress
    image: wordpress
    build: requirements/wordpress/
    depends_on:
      - mariadb
    volumes:
      - wordpress:/var/www/html
    env_file:
      - .env
    networks:
      - inception_network
    restart: on-failure
    secrets:
      - wp_admin_pw
      - wp_user_pw
      - db_wp_user_pw

  mariadb:
    container_name: mariadb
    image: mariadb
    build: requirements/mariadb/
    volumes:
      - mariadb:/var/lib/mysql
    env_file: 
      - .env
    networks:
      - inception_network
    restart: on-failure
    secrets:
      - db_alter_user_pw
      - db_wp_user_pw

networks:
  inception_network:
    driver: bridge

volumes:
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/wimam/data/wordpress
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/wimam/data/mariadb

secrets:
  wp_admin_pw:
    file: ../secrets/wp_admin_pw
  wp_user_pw:
    file: ../secrets/wp_user_pw
  db_alter_user_pw:
    file: ../secrets/db_alter_user_pw
  db_wp_user_pw:
    file: ../secrets/db_wp_user_pw